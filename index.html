<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thi thử HSK3 · 模拟考试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2230; --muted:#667085; --line:#e3e6ee; --bg:#f3f5f9; --card:#fff;
  --navy:#17325f; --navy-2:#21457f; --red:#c8102e; --red-soft:#fdecee;
  --side-w:270px; --top-h:58px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro','Noto Sans SC',system-ui,sans-serif;font-size:15px;line-height:1.55;overflow:hidden}
.zh{font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif}

/* ---------- Top bar ---------- */
.top{height:var(--top-h);background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;z-index:30}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;width:38px;height:36px;font-size:18px;cursor:pointer}
.logo{background:var(--red);color:#fff;font-weight:800;padding:5px 10px;border-radius:8px;letter-spacing:1px;font-size:15px;white-space:nowrap}
.brand{min-width:0}
.brand b{display:block;font-family:'Noto Sans SC';font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.open-new{color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px;white-space:nowrap}
.open-new:hover{background:rgba(255,255,255,.12)}
.open-new[hidden]{display:none}

/* ---------- Layout ---------- */
.wrap{display:flex;height:calc(100% - var(--top-h))}
aside{width:var(--side-w);flex:none;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 24px}
main{flex:1;min-width:0;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
iframe[hidden]{display:none}

/* ---------- Sidebar ---------- */
.home-link{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;font:inherit;font-weight:700;color:var(--navy);padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left}
.home-link:hover{background:var(--bg)}
.home-link.active{background:var(--navy);color:#fff}
.group{margin-top:14px}
.group-head{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;font:inherit;cursor:pointer;padding:6px 10px;color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.group-head .cnt{background:var(--bg);color:var(--muted);border-radius:999px;padding:0 8px;font-size:11.5px;text-transform:none}
.group-head .chev{transition:transform .15s;margin-left:6px}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed .items{display:none}
.items{display:grid;gap:4px;margin-top:4px}
.item{display:block;width:100%;border:1px solid transparent;background:transparent;font:inherit;text-align:left;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--ink)}
.item:hover{background:var(--bg)}
.item b{display:block;font-weight:600;font-size:14.5px}
.item small{display:block;color:var(--muted);font-size:12.5px}
.item.active{background:var(--red-soft);border-color:#f3c6cd}
.item.active b{color:var(--red)}
.item.soon{cursor:default;opacity:.55}
.item.soon:hover{background:transparent}
.badge-soon{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:6px;padding:0 6px;vertical-align:middle}

/* ---------- Home ---------- */
.home{height:100%;overflow-y:auto;padding:28px 24px 48px}
.home[hidden]{display:none}
.home-inner{max-width:900px;margin:0 auto}
.home h1{margin:0 0 4px;font-size:24px;color:var(--navy)}
.home h1 .zh{color:var(--red);margin-right:8px}
.home p.lead{margin:0 0 22px;color:var(--muted)}
.home h2{font-size:16px;margin:26px 0 10px;color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .12s, box-shadow .12s}
.card:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(23,50,95,.08)}
.card b{display:block;font-size:15.5px;margin-bottom:2px}
.card small{color:var(--muted)}
.card .go{display:inline-block;margin-top:10px;font-weight:700;font-size:13.5px;color:var(--red)}
.card.soon{cursor:default;opacity:.6}
.card.soon:hover{border-color:var(--line);box-shadow:none}
.card.soon .go{color:var(--muted)}

/* ---------- Mobile ---------- */
.backdrop{display:none}
@media (max-width:860px){
  .menu-btn{display:block}
  aside{position:fixed;top:var(--top-h);left:0;bottom:0;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  body.side-open aside{transform:none}
  body.side-open .backdrop{display:block;position:fixed;inset:var(--top-h) 0 0 0;background:rgba(15,22,40,.4);z-index:20}
  .brand small{display:none}
  .open-new{padding:6px 9px;font-size:12px}
  .home{padding:20px 16px 40px}
}
</style>
</head>
<body>

<header class="top">
  <button class="menu-btn" id="menu-btn" type="button" aria-label="Mở danh sách đề">☰</button>
  <span class="logo">HSK 3</span>
  <div class="brand">
    <b>中文水平考试 HSK（三级）· 模拟考试</b>
    <small id="cur-title">Thư viện đề thi thử</small>
  </div>
  <div class="spacer"></div>
  <a class="open-new" id="open-new" href="#" target="_blank" rel="noopener" hidden>Mở toàn màn hình ↗</a>
</header>

<div class="wrap">
  <aside id="side"></aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <section class="home" id="home"><div class="home-inner" id="home-inner"></div></section>
    <iframe id="frame" title="Bài thi" hidden></iframe>
  </main>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   DANH SÁCH ĐỀ THI
   - Mỗi đề nằm trong một thư mục riêng, có index.html và ảnh/audio của đề đó.
   - Thêm đề mới: tạo thư mục, rồi thêm 1 dòng vào đúng nhóm bên dưới.
   - available:false  → hiện "Sắp có", chưa bấm vào được.
   ===================================================================== */
const GROUPS = [
  { id:'on-tap', title:'Đề ôn tập', zh:'复习测试', exams:[
    { id:'on-tap/bai01-09', title:'Ôn tập Bài 1–9',   sub:'70 câu · Nghe · Đọc · Viết', available:true },
    { id:'on-tap/bai10-18', title:'Ôn tập Bài 10–18', sub:'70 câu · Nghe · Đọc · Viết', available:true }
  ]},
  { id:'de-2-0', title:'Đề mẫu HSK 2.0', zh:'HSK 2.0 样卷', exams:[
    { id:'de-2-0/de01', title:'Đề mẫu số 1 · H31001', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true },
    { id:'de-2-0/de03', title:'Đề mẫu số 3 · H31003', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true },
    { id:'de-2-0/de04', title:'Đề mẫu số 4 · H31004', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true },
    { id:'de-2-0/de05', title:'Đề mẫu số 5 · H31005', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true },
    { id:'de-2-0/de06', title:'Đề mẫu số 6 · H31006', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true },
    { id:'de-2-0/de07', title:'Đề mẫu số 7 · H31007', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true },
    { id:'de-2-0/de08', title:'Đề mẫu số 8 · H31008', sub:'80 câu · Nghe 40 · Đọc 30 · Viết 10', available:true }
  ]},
  { id:'de-3-0', title:'Đề mẫu HSK 3.0', zh:'HSK 3.0 样卷', exams:[
    { id:'de-3-0/de01', title:'Đề mẫu số 1 · 样卷', sub:'70 câu · Nghe 30 · Đọc 30 · Viết 10', available:true }
  ]}
];

/* ===================================================================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALL = {};
GROUPS.forEach(g=>g.exams.forEach(e=>{ ALL[e.id] = Object.assign({group:g}, e); }));
const CLOSED_KEY = 'thihsk3_shell_closed';
let closed = {};
try{ closed = JSON.parse(localStorage.getItem(CLOSED_KEY) || '{}') || {}; }catch(e){ closed = {}; }

function renderSide(){
  let h = `<button class="home-link" data-home type="button">🏠 Trang chủ</button>`;
  GROUPS.forEach(g=>{
    const ready = g.exams.filter(e=>e.available).length;
    h += `<div class="group${closed[g.id]?' closed':''}" data-group="${g.id}">
      <button class="group-head" type="button" data-toggle="${g.id}">
        <span>${esc(g.title)}</span><span><span class="cnt">${ready}/${g.exams.length}</span><span class="chev">▾</span></span>
      </button><div class="items">`;
    g.exams.forEach(e=>{
      h += `<button class="item${e.available?'':' soon'}" type="button" data-exam="${e.id}"${e.available?'':' disabled'}>
        <b>${esc(e.title)}${e.available?'':'<span class="badge-soon">Sắp có</span>'}</b><small>${esc(e.sub||'')}</small></button>`;
    });
    h += `</div></div>`;
  });
  $('#side').innerHTML = h;
}

function renderHome(){
  let h = `<h1><span class="zh">模拟考试</span>Thi thử HSK3</h1>
    <p class="lead">Chọn một đề ở thanh bên trái hoặc bên dưới để bắt đầu làm bài. Bài làm tự lưu trên máy, mỗi đề lưu riêng.</p>`;
  GROUPS.forEach(g=>{
    h += `<h2>${esc(g.title)} <span class="zh" style="color:var(--muted);font-weight:500;font-size:14px">${esc(g.zh||'')}</span></h2><div class="cards">`;
    g.exams.forEach(e=>{
      h += `<button class="card${e.available?'':' soon'}" type="button" data-exam="${e.id}"${e.available?'':' disabled'}>
        <b>${esc(e.title)}</b><small>${esc(e.sub||'')}</small><br>
        <span class="go">${e.available?'Làm bài →':'Sắp có'}</span></button>`;
    });
    h += `</div>`;
  });
  $('#home-inner').innerHTML = h;
}

function examUrl(id){ return id + '/index.html'; }

function show(id){
  const e = ALL[id];
  const frame = $('#frame');
  document.querySelectorAll('[data-exam]').forEach(b=>b.classList.toggle('active', b.dataset.exam===id && b.classList.contains('item')));
  document.querySelector('[data-home]').classList.toggle('active', !e);
  if(e && e.available){
    const url = examUrl(id);
    if(frame.getAttribute('src') !== url) frame.setAttribute('src', url);
    frame.hidden = false; $('#home').hidden = true;
    $('#cur-title').textContent = e.group.title + ' · ' + e.title;
    $('#open-new').href = url; $('#open-new').hidden = false;
    document.title = e.title + ' · Thi thử HSK3';
  }else{
    frame.hidden = true; $('#home').hidden = false;
    $('#cur-title').textContent = 'Thư viện đề thi thử';
    $('#open-new').hidden = true;
    document.title = 'Thi thử HSK3 · 模拟考试';
  }
  document.body.classList.remove('side-open');
}

function route(){
  const id = decodeURIComponent((location.hash||'').slice(1));
  show(ALL[id] && ALL[id].available ? id : null);
}

document.addEventListener('click', ev=>{
  const ex = ev.target.closest('[data-exam]');
  if(ex && !ex.disabled){ location.hash = ex.dataset.exam; return; }
  if(ev.target.closest('[data-home]')){ history.pushState(null,'',location.pathname); route(); return; }
  const tg = ev.target.closest('[data-toggle]');
  if(tg){
    const id = tg.dataset.toggle; closed[id] = !closed[id];
    tg.parentNode.classList.toggle('closed', !!closed[id]);
    try{ localStorage.setItem(CLOSED_KEY, JSON.stringify(closed)); }catch(e){}
  }
});
$('#menu-btn').addEventListener('click', ()=>document.body.classList.toggle('side-open'));
$('#backdrop').addEventListener('click', ()=>document.body.classList.remove('side-open'));
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);

renderSide(); renderHome(); route();
})();
</script>
</body>
</html>
