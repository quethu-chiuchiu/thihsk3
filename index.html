<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 3 · 模拟考试 | Thi thử HSK3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --ink:#1c2230; --muted:#667085; --line:#e3e6ee; --bg:#f3f5f9; --card:#fff;
  --navy:#17325f; --navy-2:#21457f; --red:#c8102e; --red-soft:#fdecee;
  --ok:#13824f; --ok-soft:#e6f5ed; --bad:#c9302c; --bad-soft:#fbeaea;
  --sel:#17325f; --sel-soft:#e8eef8; --amber:#b7791f; --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro','Noto Sans SC',system-ui,sans-serif;font-size:16px;line-height:1.6}
.zh{font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif}
.muted{color:var(--muted)}

/* ---------- Top bar ---------- */
.sticky-top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.topbar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{background:var(--red);color:#fff;font-weight:800;padding:6px 10px;border-radius:8px;letter-spacing:1px;font-size:15px;white-space:nowrap;flex:none}
.brand-zh{font-weight:700;font-family:'Noto Sans SC';font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-vi{font-size:12.5px;opacity:.8}
.cand{display:flex;align-items:center;gap:8px}
.cand label{font-size:13px;opacity:.85;white-space:nowrap}
.cand input{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-size:14.5px;width:230px}
.cand input::placeholder{color:rgba(255,255,255,.55)}
.cand input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.16)}
.cand input:disabled{opacity:.85}
.btn{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{filter:brightness(1.08)}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--navy)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn:disabled{opacity:.6;cursor:wait}

.tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 16px}
.tab{flex:1;background:transparent;border:0;color:rgba(255,255,255,.7);padding:10px 8px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.tab:hover{color:#fff}
.tab.active{color:#fff;border-bottom-color:var(--red)}
.tab-zh{font-family:'Noto Sans SC';font-weight:700}
.tab-vi{font-weight:600}
.tab-count{font-size:12px;background:rgba(255,255,255,.15);padding:1px 9px;border-radius:999px}

/* ---------- Layout ---------- */
main,#result-view{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
#exam-view[hidden],#result-view[hidden]{display:none}
.pane{display:none}
.pane.active{display:block}
.pane-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
.navi{position:sticky;top:132px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.navi h4{margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:600}
.navi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nv{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 0;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.nv:hover{border-color:var(--navy)}
.nv.done{background:var(--sel);color:#fff;border-color:var(--sel)}
.nv.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.nv.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.nv.manual{background:var(--amber);color:#fff;border-color:var(--amber)}
.navi-legend{margin-top:12px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.navi-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sec-head .ico{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.sec-head h2{margin:0;font-size:22px;line-height:1.25}
.sec-head h2 .zh{color:var(--red);margin-right:8px}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}
.part-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:12px}
.part-zh{font-family:'Noto Sans SC';font-weight:800;font-size:19px;color:var(--navy)}
.part-vi{font-weight:600;color:var(--muted);font-size:14.5px}
.part-instr{font-size:14.5px;color:var(--muted);margin:0 0 14px}
.group-title{font-family:'Noto Sans SC';font-weight:700;margin:18px 0 10px;font-size:16.5px}

.audio{display:flex;align-items:center;gap:12px;background:var(--sel-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.audio span{font-weight:700;font-size:14px;color:var(--navy)}
.audio audio{flex:1;min-width:240px;height:40px}

.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.pic{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafbfc;aspect-ratio:4/3}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic-l{position:absolute;top:6px;left:6px;background:var(--navy);color:#fff;font-weight:800;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:15px;z-index:1}
.pic.noimg::after,.wimg.noimg::after{content:'Chưa có ảnh';position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}

.example{display:flex;gap:12px;align-items:flex-start;background:#fbfaf3;border:1px dashed #d9cfa8;border-radius:10px;padding:12px 14px;margin:6px 0 16px;font-family:'Noto Sans SC'}
.ex-tag{flex:none;background:#efe6c2;color:#7a5c00;font-weight:700;border-radius:6px;padding:1px 8px;font-size:13.5px;margin-top:2px}
.ex-body{flex:1;min-width:0}
.ex-ans{flex:none;font-weight:700}
.boxed{display:inline-grid;place-items:center;min-width:30px;height:30px;border:2px solid var(--ink);border-radius:4px;font-weight:800;font-family:'Be Vietnam Pro'}

.q{scroll-margin-top:140px;padding:12px 0;border-top:1px solid #eef0f5}
.q-inline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.q-head{display:flex;gap:10px;align-items:flex-start}
.q-num{flex:none;min-width:34px;height:30px;border-radius:7px;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.q-text{font-family:'Noto Sans SC';font-size:17px;padding-top:2px;line-height:1.8}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.q-inline .opts{margin-top:0}
.q-block .opts{margin-left:44px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink);transition:background .12s,border-color .12s;min-height:38px}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt-l{font-weight:800;color:var(--navy)}
.opt-t{font-family:'Noto Sans SC';font-size:16px}
.opt.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.opt.sel .opt-l{color:#fff}
.opt.used{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.locked .opt{cursor:default}
.opt.is-key{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.is-key .opt-l{color:var(--ok)}
.opt.sel.is-key{background:var(--ok);color:#fff}
.opt.sel.is-key .opt-l{color:#fff}
.opt.is-wrong{background:var(--bad);border-color:var(--bad);color:#fff;opacity:1}
.opt.is-wrong .opt-l{color:#fff}

.optlist{display:grid;gap:6px;background:#f7f8fb;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-family:'Noto Sans SC';font-size:16.5px}
.optlist div{display:flex;gap:10px}
.optlist b{color:var(--navy);min-width:16px;font-family:'Be Vietnam Pro'}
.optlist .used{opacity:.45}
.wordbank{display:flex;flex-wrap:wrap;gap:8px 22px;background:#f7f8fb;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-family:'Noto Sans SC';font-size:17.5px}
.wordbank b{color:var(--navy);margin-right:5px;font-family:'Be Vietnam Pro'}
.wordbank .used{opacity:.45;text-decoration:line-through}
.blank{display:inline-block;min-width:44px;text-align:center;border-bottom:2px solid var(--navy);margin:0 2px;color:var(--navy);font-weight:800;font-family:'Be Vietnam Pro'}
.dlg{display:block}

.passage{font-family:'Noto Sans SC';font-size:16.5px;line-height:1.9;background:#f7f8fb;border-left:4px solid var(--navy);border-radius:8px;padding:12px 16px;margin:14px 0 4px}
.pnum{font-weight:800;color:var(--navy);margin-right:6px;font-family:'Be Vietnam Pro'}
.passage + .q{border-top:0}

.pyb{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 4px}
.py{font-size:14px;color:var(--red);line-height:1.2;font-family:'Be Vietnam Pro';font-weight:600}
.hz{width:64px;height:46px;text-align:center;font-family:'Noto Sans SC';font-size:24px;border:2px solid #c9cedb;border-radius:8px;background:#fff;color:var(--ink)}
.hz:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--sel-soft)}
.hz.ok{border-color:var(--ok);background:var(--ok-soft)}
.hz.bad{border-color:var(--bad);background:var(--bad-soft)}
.hz-static{display:inline-grid;place-items:center;width:64px;height:46px;border:2px solid #c9cedb;border-radius:8px;font-family:'Noto Sans SC';font-size:24px;font-weight:700}
.hz-key{display:block;font-size:13px;color:var(--ok);font-weight:700;text-align:center;font-family:'Noto Sans SC'}

.wrow{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.wimg{aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafbfc;position:relative}
.wimg img{width:100%;height:100%;object-fit:contain;display:block}
.kw{display:inline-block;font-family:'Noto Sans SC';font-weight:700;font-size:20px;color:var(--red);background:var(--red-soft);border-radius:8px;padding:2px 12px;margin-bottom:8px}
textarea.wt{width:100%;min-height:110px;resize:vertical;font-family:'Noto Sans SC';font-size:18px;border:2px solid #c9cedb;border-radius:10px;padding:10px 12px;color:var(--ink);background:#fff}
textarea.wt:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--sel-soft)}
.ex-sentence{font-family:'Noto Sans SC';font-size:18px;border-bottom:2px solid var(--ink);padding:4px 2px}
.sample{display:none;margin-top:8px;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-family:'Noto Sans SC';font-size:15.5px}
.locked .sample{display:block}
.manual-tag{display:none;margin-top:6px;font-size:13px;color:var(--amber);font-weight:700}
.locked .manual-tag{display:block}

.pane-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 24px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,22,40,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-box h3{margin:0 0 8px;font-size:18px;color:var(--navy)}
.modal-box p{margin:0 0 6px;color:#3a4252;font-size:15px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* ---------- Result sheet ---------- */
.result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:14px}
#result-sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;color:#1c2230}
#result-sheet.exporting{width:780px;border:0;border-radius:0;padding:0}
.rs-head{text-align:center;border-bottom:3px double var(--navy);padding-bottom:12px;margin-bottom:14px}
.rs-zh{font-family:'Noto Sans SC';font-weight:800;font-size:21px;color:var(--navy)}
.rs-vi{font-weight:700;letter-spacing:1px;color:var(--red);margin-top:2px;font-size:15px}
.rs-info{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;text-align:left}
.rs-info td{border:1px solid #d9dde7;padding:6px 10px}
.rs-info td.k{background:#eef1f7;font-weight:600;width:18%}
.rs-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.rs-card{border:1px solid #d9dde7;border-radius:10px;padding:10px;text-align:center}
.rs-card .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.rs-card .val{font-size:24px;font-weight:800;color:var(--navy);line-height:1.3}
.rs-card .val small{font-size:14px;color:var(--muted);font-weight:600}
.rs-card .val.gv{font-size:15px;color:var(--amber);padding:6px 0}
.rs-total{text-align:right;font-size:14px;margin-top:6px}
.rs-sec{margin-top:20px}
.rs-sec h3{font-size:15.5px;margin:0 0 8px;color:#fff;background:var(--navy);padding:6px 12px;border-radius:6px}
.rs-scroll{overflow-x:auto}
.rs-tbl{width:100%;border-collapse:collapse;font-size:13px}
.rs-tbl th{background:#eef1f7;text-align:left;padding:6px 8px;border:1px solid #d9dde7;font-weight:700}
.rs-tbl td{padding:6px 8px;border:1px solid #d9dde7;vertical-align:top}
.rs-tbl td.zh{font-family:'Noto Sans SC'}
.rs-tbl tr{page-break-inside:avoid;break-inside:avoid}
.rs-tbl tr.grp td{background:#f4f6fb;font-weight:700;color:var(--navy)}
.rs-tbl tr.psg td{background:#fbfbfd;font-family:'Noto Sans SC';color:#3a4252;font-size:12.5px;line-height:1.7}
.rs-tbl small{color:var(--muted)}
.c-num{width:42px;text-align:center}
.c-mk{width:42px;text-align:center}
.mk-ok{color:var(--ok);font-weight:800;text-align:center}
.mk-bad{color:var(--bad);font-weight:800;text-align:center}
.rs-thumb{width:110px;height:82px;object-fit:contain;border:1px solid #e3e6ee;border-radius:6px;background:#fafbfc;display:block}
.rs-gv{width:70px}
.rs-note{font-size:12.5px;color:var(--muted);margin-top:8px}
.rs-sign{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:14px;page-break-inside:avoid;break-inside:avoid}
.rs-sign div{text-align:center}
.rs-sign .line{margin-top:44px;border-top:1px dashed #999;padding-top:4px;color:var(--muted);font-size:12.5px}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .pane-grid{grid-template-columns:1fr}
  .navi{position:static;order:-1}
  .navi-grid{grid-template-columns:repeat(10,1fr)}
  .topbar{flex-wrap:wrap}
  .cand{order:3;width:100%}
  .cand input{flex:1;width:auto}
  .wrow{grid-template-columns:1fr}
  .pics{grid-template-columns:repeat(2,1fr)}
  .q-block .opts{margin-left:0}
  .card{padding:16px}
  .tab{font-size:14px;padding:8px 4px 10px;gap:4px}
  .tab-zh{display:none}
  .q{scroll-margin-top:170px}
}
@media (max-width:700px){
  .rs-cards{grid-template-columns:repeat(2,1fr)}
  #result-sheet{padding:16px}
  .brand-vi{display:none}
}

/* ---------- Print ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .sticky-top,#exam-view,.result-actions,.modal{display:none!important}
  #result-view{padding:0;max-width:none;display:block!important}
  #result-sheet{border:0;padding:0}
  .rs-sec h3,.rs-tbl th,.rs-tbl tr.grp td,.rs-info td.k{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="sticky-top">
  <header class="topbar">
    <div class="brand">
      <span class="logo">HSK 3</span>
      <div style="min-width:0">
        <div class="brand-zh">中文水平考试 HSK（三级）模拟考试</div>
        <div class="brand-vi">Đề thi thử · Nội dung Bài 1–9 · 70 câu</div>
      </div>
    </div>
    <div class="cand">
      <label for="cand-name">Thí sinh</label>
      <input id="cand-name" type="text" placeholder="Nhập họ tên…" autocomplete="name">
    </div>
    <button id="btn-submit" class="btn btn-red" type="button">Nộp bài</button>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="listening" type="button"><span class="tab-zh">一、听力</span><span class="tab-vi">Nghe</span><span class="tab-count" id="cnt-listening">0/30</span></button>
    <button class="tab" data-tab="reading" type="button"><span class="tab-zh">二、阅读</span><span class="tab-vi">Đọc</span><span class="tab-count" id="cnt-reading">0/30</span></button>
    <button class="tab" data-tab="writing" type="button"><span class="tab-zh">三、书写</span><span class="tab-vi">Viết</span><span class="tab-count" id="cnt-writing">0/10</span></button>
  </nav>
</div>

<main id="exam-view">
  <section class="pane" data-pane="listening"><div class="pane-grid"><div id="body-listening"></div><aside class="navi" id="navi-listening"></aside></div></section>
  <section class="pane" data-pane="reading"><div class="pane-grid"><div id="body-reading"></div><aside class="navi" id="navi-reading"></aside></div></section>
  <section class="pane" data-pane="writing"><div class="pane-grid"><div id="body-writing"></div><aside class="navi" id="navi-writing"></aside></div></section>
</main>

<section id="result-view" hidden>
  <div class="result-actions">
    <button class="btn btn-ghost" id="btn-review" type="button">← Xem lại bài làm</button>
    <button class="btn btn-ghost" id="btn-print" type="button">In</button>
    <button class="btn btn-navy" id="btn-pdf" type="button">Tải PDF</button>
    <button class="btn btn-red" id="btn-new" type="button">Làm bài mới</button>
  </div>
  <div id="result-sheet"></div>
</section>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="m-cancel" type="button">Hủy</button>
      <button class="btn btn-red" id="m-ok" type="button">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   DỮ LIỆU ĐỀ THI
   ===================================================================== */
const AUDIO = {
  p1: 'Nghe/Part1/audio/listening_1-10.MP3',
  p2: 'Nghe/Part2/audio/listening_11-20.MP3',
  p3: 'Nghe/Part2/audio/listening_21-30.MP3'
};
const IMG_L = 'Nghe/Part1/image/';

/* ---- Nghe ---- */
const L_KEY = {1:'C',2:'A',3:'B',4:'F',5:'E',6:'B',7:'A',8:'D',9:'C',10:'E',
  11:'C',12:'B',13:'B',14:'C',15:'C',16:'A',17:'C',18:'A',19:'B',20:'A',
  21:'C',22:'B',23:'C',24:'A',25:'A',26:'B',27:'A',28:'B',29:'A',30:'C'};
const L_OPTS = {
  11:{A:'跳舞',B:'讲故事',C:'唱中文歌'},
  12:{A:'住院了',B:'变胖了',C:'太累了'},
  13:{A:'9:05',B:'10:15',C:'10:30'},
  14:{A:'手表坏了',B:'书包丢了',C:'电脑不能开机'},
  15:{A:'宾馆',B:'球场',C:'卫生间'},

const STORE = 'thihsk3_exam_v1';
let state = {name:'', answers:{}, submitted:false, submittedAt:null};
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if(s && typeof s === 'object'){ state = Object.assign(state, s); if(!state.answers) state.answers = {}; }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

   TIỆN ÍCH
   ===================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ans = n=>String(state.answers[n]==null?'':state.answers[n]).trim();
function grade(n){
  if(KEY[n]==null) return 'manual';
  const v = ans(n);
  if(!v) return 'empty';
  return v===KEY[n] ? 'ok' : 'bad';
}
function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }

/* =====================================================================
   DỰNG GIAO DIỆN ĐỀ
   ===================================================================== */
function secHead(icon, zh, vi, note){
  return `<div class="sec-head"><div class="ico">${icon}</div><div><h2><span class="zh">${zh}</span>${vi}</h2><p>${note}</p></div></div>`;
}
function partHead(zh, vi, instr){
  return `<div class="part-head"><span class="part-zh">${zh}</span><span class="part-vi">${vi}</span></div>`+
         (instr?`<p class="part-instr">${instr}</p>`:'');
}
function audioBox(src, label){
  return `<div class="audio"><span>🎧 ${label}</span><audio controls preload="none" src="${src}"></audio></div>`;
}
function picGrid(dir, letters){
  return `<div class="pics">`+letters.map(L=>
    `<figure class="pic"><span class="pic-l">${L}</span><img src="${IMG_L}${dir}/${L}.webp" alt="Tranh ${L}" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()"></figure>`
  ).join('')+`</div>`;
}
function example(body, answer){
  return `<div class="example"><span class="ex-tag">例如</span><div class="ex-body">${body}</div>${answer?`<div class="ex-ans">${answer}</div>`:''}</div>`;
}
function optBtns(n, letters, labels, disabled){
  return `<div class="opts">`+letters.map(L=>{
    const dis = disabled && disabled.includes(L);
    return `<button type="button" class="opt${dis?' used':''}" data-q="${n}" data-v="${L}"${dis?' disabled title="Đã dùng cho ví dụ"':''}>`+
           `<span class="opt-l">${L}</span>${labels&&labels[L]?`<span class="opt-t">${esc(labels[L])}</span>`:''}</button>`;
  }).join('')+`</div>`;
}
function qInline(n, opts){ return `<div class="q q-inline" id="q-${n}"><span class="q-num">${n}</span>${opts}</div>`; }
function qBlock(n, textHtml, opts){
  return `<div class="q q-block" id="q-${n}"><div class="q-head"><span class="q-num">${n}</span><div class="q-text">${textHtml}</div></div>${opts}</div>`;
}
function blankHtml(n){ return `（<span class="blank" data-blank="${n}">&nbsp;</span>）`; }
function linesHtml(lines, n, fixed){
  return lines.map(l=>`<span class="dlg">${l.replace('__', fixed!=null ? `（<span class="blank">${fixed}</span>）` : blankHtml(n))}</span>`).join('');
}
function optList(opts, usedLetter){
  return `<div class="optlist">`+Object.keys(opts).map(k=>`<div class="${k===usedLetter?'used':''}"><b>${k}</b><span>${esc(opts[k])}</span></div>`).join('')+`</div>`;
}
function wordBank(words, usedLetter){
  return `<div class="wordbank">`+Object.keys(words).map(k=>`<span class="${k===usedLetter?'used':''}"><b>${k}</b>${esc(words[k])}</span>`).join('')+`</div>`;
}
function paneFoot(prev, next, isLast){
  return `<div class="pane-foot"><div>${prev?`<button class="btn btn-ghost" data-go="${prev[0]}" type="button">← ${prev[1]}</button>`:''}</div>`+
         `<div>${isLast?`<button class="btn btn-red" data-action="submit" type="button">Nộp bài</button>`:`<button class="btn btn-navy" data-go="${next[0]}" type="button">Tiếp theo: ${next[1]} →</button>`}</div></div>`;
}

  p = partHead('第二部分','Phần 2 · Câu 66–70','看图，用词造句。— Nhìn tranh, dùng từ cho sẵn đặt một câu hoàn chỉnh.');
  p += `<div class="example"><span class="ex-tag">例如</span><div class="ex-body"><div class="wrow">`+
       `<div class="wimg"><img src="${W2_EX.img}" alt="Ví dụ" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>`+
       `<div><div class="kw">${W2_EX.word}</div><div class="ex-sentence">他<b>开心</b>得跳起来了。</div></div></div></div></div>`;
  W2.forEach(x=>{
    p += `<div class="q" id="q-${x.n}"><div class="q-head" style="margin-bottom:10px"><span class="q-num">${x.n}</span></div><div class="wrow">`+
         `<div class="wimg"><img src="${x.img}" alt="Tranh câu ${x.n}" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>`+
         `<div><div class="kw">${esc(x.word)}</div>`+
         `<textarea class="wt" data-q="${x.n}" placeholder="Viết một câu có dùng từ「${esc(x.word)}」…" spellcheck="false"></textarea>`+
         `<div class="manual-tag">⏳ Giáo viên chấm</div>`+
         `<div class="sample">Câu mẫu tham khảo: ${esc(x.sample)}</div></div></div></div>`;
  });
  h += `<div class="card">${p}</div>`;

  h += paneFoot(['reading','Đọc'], null, true);
  $('#body-writing').innerHTML = h;
}

function renderNavi(){
  Object.keys(SECS).forEach(sec=>{
    const s = SECS[sec];
    const btns = range(s.from, s.to).map(n=>`<button type="button" class="nv" data-n="${n}">${n}</button>`).join('');
    $('#navi-'+sec).innerHTML = `<h4>Danh sách câu · ${s.name}</h4><div class="navi-grid">${btns}</div><div class="navi-legend" data-legend></div>`;
  });
  renderLegend();
}
function renderLegend(){
  const html = state.submitted
    ? `<span><i style="background:var(--ok)"></i>Đúng</span><span><i style="background:var(--bad)"></i>Sai / bỏ trống</span><span><i style="background:var(--amber)"></i>Giáo viên chấm</span>`
    : `<span><i style="background:var(--sel)"></i>Đã làm</span><span><i style="border:1px solid var(--line)"></i>Chưa làm</span>`;
  $$('[data-legend]').forEach(el=>el.innerHTML = html);
}

/* =====================================================================
   CẬP NHẬT TRẠNG THÁI TỪNG CÂU
   ===================================================================== */
function refreshQ(n){
  const v = ans(n);
  $$(`.opt[data-q="${n}"]`).forEach(b=>b.classList.toggle('sel', b.dataset.v===v));
  const bl = $(`[data-blank="${n}"]`);
  if(bl) bl.innerHTML = v ? esc(v) : '&nbsp;';
  const nv = $(`.nv[data-n="${n}"]`);
  if(nv && !state.submitted) nv.classList.toggle('done', !!v);
}
function updateCounts(){
  Object.keys(SECS).forEach(sec=>{
    const s = SECS[sec];
    const done = range(s.from, s.to).filter(n=>ans(n)).length;
    $('#cnt-'+sec).textContent = done+'/'+(s.to-s.from+1);
  });
}
function setAnswer(n, v){
  if(state.submitted) return;
  state.answers[n] = v;
  save(); refreshQ(n); updateCounts();
}

/* =====================================================================
   ĐIỀU HƯỚNG
   ===================================================================== */
function showTab(tab){
  $('#exam-view').hidden = false;
  $('#result-view').hidden = true;
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  $$('.pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===tab));
  try{ history.replaceState(null,'','#'+tab); }catch(e){}
  window.scrollTo({top:0, behavior:'auto'});
}
function showResult(){
  buildResult();
  $('#exam-view').hidden = true;
  $('#result-view').hidden = false;
  $$('.tab').forEach(t=>t.classList.remove('active'));
  try{ history.replaceState(null,'','#ketqua'); }catch(e){}
  window.scrollTo({top:0, behavior:'auto'});
}
function secOf(n){ return Object.keys(SECS).find(k=>n>=SECS[k].from && n<=SECS[k].to); }

/* =====================================================================
   HỘP THOẠI
   ===================================================================== */
function modal(title, bodyHtml, okText, cancelText){
  return new Promise(resolve=>{
    $('#m-title').textContent = title;
    $('#m-body').innerHTML = bodyHtml;
    $('#m-ok').textContent = okText || 'OK';
    const cancel = $('#m-cancel');
    cancel.hidden = cancelText === null;
    cancel.textContent = cancelText || 'Hủy';
    $('#modal').hidden = false;
    const done = v=>{ $('#modal').hidden = true; $('#m-ok').onclick = null; cancel.onclick = null; resolve(v); };
    $('#m-ok').onclick = ()=>done(true);
    cancel.onclick = ()=>done(false);
  });
}

/* =====================================================================
   NỘP BÀI + KHÓA BÀI
   ===================================================================== */
async function submit(){
  if(state.submitted){ showResult(); return; }
  const name = $('#cand-name').value.trim();
  if(!name){
    await modal('Chưa có họ tên', '<p>Vui lòng nhập họ tên thí sinh ở thanh trên cùng trước khi nộp bài.</p>', 'Đã hiểu', null);
    $('#cand-name').focus();
    return;
  }
  const missing = {};
  Object.keys(SECS).forEach(sec=>{
    const s = SECS[sec];
    missing[sec] = range(s.from, s.to).filter(n=>!ans(n));
  });
  const totalMissing = missing.listening.length + missing.reading.length + missing.writing.length;
  let body = '<p>Sau khi nộp, bài làm sẽ bị khóa và không sửa được nữa.</p>';
  if(totalMissing){
    body += `<p style="color:var(--bad);font-weight:600">Còn ${totalMissing} câu chưa làm:</p><p style="font-size:14px">`+
      Object.keys(SECS).filter(s=>missing[s].length).map(s=>`<b>${SECS[s].name}:</b> ${missing[s].join(', ')}`).join('<br>')+'</p>';
  }else{
    body += '<p style="color:var(--ok);font-weight:600">Đã làm đủ 70 câu.</p>';
  }
  const ok = await modal('Nộp bài?', body, 'Nộp bài', 'Làm tiếp');
  if(!ok) return;
  state.name = name;
  state.submitted = true;
  state.submittedAt = new Date().toISOString();
  save();
  applyLock();
  showResult();
}

function applyLock(){
  document.body.classList.add('locked');
  $('#cand-name').disabled = true;
  $('#btn-submit').textContent = 'Xem kết quả';
  $$('.opt').forEach(b=>{
    b.disabled = true;
    const n = +b.dataset.q, v = b.dataset.v;
    if(KEY[n]==null) return;
    if(v===KEY[n]) b.classList.add('is-key');
    else if(v===ans(n)) b.classList.add('is-wrong');
  });
  $$('input.hz').forEach(inp=>{
    const n = +inp.dataset.q;
    inp.disabled = true;
    const g = grade(n);
    inp.classList.add(g==='ok' ? 'ok' : 'bad');
    if(g!=='ok' && !inp.parentNode.querySelector('.hz-key')){
      inp.insertAdjacentHTML('afterend', `<span class="hz-key">✓ ${KEY[n]}</span>`);
    }
  });
  $$('textarea.wt').forEach(t=>t.disabled = true);
  $$('.nv').forEach(nv=>{
    const g = grade(+nv.dataset.n);
    nv.classList.remove('done');
    nv.classList.add(g==='ok' ? 'ok' : g==='manual' ? 'manual' : 'bad');
  });
  renderLegend();
}

/* =====================================================================
   PHIẾU KẾT QUẢ
   ===================================================================== */
function stat(sec, onlyKeyed){
  const s = SECS[sec];
  const ns = range(s.from, s.to).filter(n=>!onlyKeyed || KEY[n]!=null);
  return {ok: ns.filter(n=>grade(n)==='ok').length, total: ns.length};
}
const optLine = opts=>Object.keys(opts).map(k=>`${k} ${esc(opts[k])}`).join('　');
function optStr(opts, v){
  if(!v) return '<span class="muted">(bỏ trống)</span>';
  return `<b>${esc(v)}</b>${opts && opts[v] ? ' · '+esc(opts[v]) : ''}`;
}
function mk(n){ return grade(n)==='ok' ? '<td class="mk-ok">✓</td>' : '<td class="mk-bad">✗</td>'; }
function row(n, content, student, key){
  return `<tr><td class="c-num">${n}</td><td class="zh">${content}</td><td class="zh">${student}</td><td class="zh">${key}</td>${mk(n)}</tr>`;
}
const TH = '<tr><th class="c-num">Câu</th><th>Câu hỏi</th><th>Bài làm</th><th>Đáp án</th><th class="c-mk">KQ</th></tr>';
const grp = t=>`<tr class="grp"><td colspan="5">${t}</td></tr>`;
const fillLines = lines=>lines.map(l=>esc(l).replace('__','（　　）')).join('<br>');

function buildResult(){
  const L = stat('listening'), R = stat('reading'), W = stat('writing', true);
  const totalOk = L.ok + R.ok + W.ok;
  let when = '';
  try{ when = new Date(state.submittedAt).toLocaleString('vi-VN'); }catch(e){ when = state.submittedAt || ''; }

  let h = `<div class="rs-head">
      <div class="rs-zh">中文水平考试 HSK（三级）· 模拟考试</div>
      <div class="rs-vi">PHIẾU KẾT QUẢ BÀI THI THỬ</div>
      <table class="rs-info"><tr>
        <td class="k">Thí sinh</td><td><b>${esc(state.name)}</b></td>
        <td class="k">Thời gian nộp</td><td>${esc(when)}</td>
      </tr></table>
    </div>
    <div class="rs-cards">
      <div class="rs-card"><div class="lbl">听力 · Nghe</div><div class="val">${L.ok}<small> / ${L.total}</small></div></div>
      <div class="rs-card"><div class="lbl">阅读 · Đọc</div><div class="val">${R.ok}<small> / ${R.total}</small></div></div>
      <div class="rs-card"><div class="lbl">书写 · Viết phần 1</div><div class="val">${W.ok}<small> / ${W.total}</small></div></div>
      <div class="rs-card"><div class="lbl">书写 · Viết phần 2</div><div class="val gv">Giáo viên chấm</div></div>
    </div>
    <div class="rs-total">Tổng số câu đúng (phần tự chấm): <b>${totalOk} / ${AUTO_TOTAL}</b></div>`;

  // Nghe
  let t = TH + grp('第一部分 · Câu 1–10 · Nghe hội thoại, chọn tranh');
  range(1,10).forEach(n=>{ t += row(n, n<=5 ? 'Chọn tranh A–F (第1～5题)' : 'Chọn tranh A–E (第6～10题)', optStr(null, ans(n)), `<b>${KEY[n]}</b>`); });
  t += grp('第二部分 · Câu 11–20 · Nghe hội thoại, chọn đáp án');
  range(11,20).forEach(n=>{ t += row(n, optLine(L_OPTS[n]), optStr(L_OPTS[n], ans(n)), optStr(L_OPTS[n], KEY[n])); });
  t += grp('第三部分 · Câu 21–30 · Nghe đoạn văn, chọn đáp án');
  range(21,30).forEach(n=>{ t += row(n, optLine(L_OPTS[n]), optStr(L_OPTS[n], ans(n)), optStr(L_OPTS[n], KEY[n])); });
  h += `<div class="rs-sec"><h3>一、听力 · Nghe hiểu (${L.ok}/${L.total})</h3><div class="rs-scroll"><table class="rs-tbl">${t}</table></div></div>`;

  // Đọc
  t = TH + grp('第一部分 · Câu 31–35 · Ghép câu (A–F)');
  R1A.forEach(x=>{ t += row(x.n, esc(x.q), optStr(R1A_OPTS, ans(x.n)), optStr(R1A_OPTS, x.a)); });
  t += grp('Câu 36–40 · Ghép câu (A–E)');
  R1B.forEach(x=>{ t += row(x.n, esc(x.q), optStr(R1B_OPTS, ans(x.n)), optStr(R1B_OPTS, x.a)); });
  t += grp('第二部分 · Câu 41–45 · Chọn từ: '+optLine(R2A_WORDS));
  R2A.forEach(x=>{ t += row(x.n, fillLines(x.lines), optStr(R2A_WORDS, ans(x.n)), optStr(R2A_WORDS, x.a)); });
  t += grp('Câu 46–50 · Chọn từ: '+optLine(R2B_WORDS));
  R2B.forEach(x=>{ t += row(x.n, fillLines(x.lines), optStr(R2B_WORDS, ans(x.n)), optStr(R2B_WORDS, x.a)); });
  t += grp('第三部分 · Câu 51–60 · Đọc hiểu đoạn văn');
  R3.forEach(b=>{
    t += `<tr class="psg"><td colspan="5"><b>${b.label}</b> ${esc(b.passage)}</td></tr>`;
    b.qs.forEach(x=>{ t += row(x.n, `★ ${esc(x.q)}<br><small>${optLine(x.opts)}</small>`, optStr(x.opts, ans(x.n)), optStr(x.opts, x.a)); });
  });
  h += `<div class="rs-sec"><h3>二、阅读 · Đọc hiểu (${R.ok}/${R.total})</h3><div class="rs-scroll"><table class="rs-tbl">${t}</table></div></div>`;

  // Viết phần 1
  t = TH + grp('第一部分 · Câu 61–65 · Viết chữ Hán theo pinyin');
  W1.forEach(x=>{
    const v = ans(x.n);
    t += row(x.n, `${esc(x.before)}（${esc(x.py)}）${esc(x.after)}`, v ? `<b>${esc(v)}</b>` : '<span class="muted">(bỏ trống)</span>', `<b>${x.a}</b>`);
  });
  h += `<div class="rs-sec"><h3>三、书写 · Viết — Phần 1 (${W.ok}/${W.total})</h3><div class="rs-scroll"><table class="rs-tbl">${t}</table></div></div>`;

  // Viết phần 2
  t = `<tr><th class="c-num">Câu</th><th>Tranh</th><th>Từ</th><th>Bài làm của thí sinh</th><th>Câu mẫu (tham khảo)</th><th class="rs-gv">Điểm GV</th></tr>`;
  W2.forEach(x=>{
    const v = ans(x.n);
    t += `<tr><td class="c-num">${x.n}</td><td><img class="rs-thumb" src="${x.img}" alt="" onerror="this.style.visibility='hidden'"></td>`+
         `<td class="zh"><b>${esc(x.word)}</b></td>`+
         `<td class="zh">${v ? esc(v) : '<span class="muted">(bỏ trống)</span>'}</td>`+
         `<td class="zh"><small>${esc(x.sample)}</small></td><td></td></tr>`;
  });
  h += `<div class="rs-sec"><h3>三、书写 · Viết — Phần 2 (giáo viên chấm)</h3><div class="rs-scroll"><table class="rs-tbl">${t}</table></div>
        <p class="rs-note">Phần 2 có nhiều cách viết đúng. Câu mẫu chỉ để giáo viên tham khảo khi chấm.</p></div>`;

  h += `<div class="rs-sign"><div>Thí sinh<div class="line">${esc(state.name)}</div></div><div>Giáo viên chấm phần Viết<div class="line">Ký và ghi rõ họ tên</div></div></div>`;

  $('#result-sheet').innerHTML = h;
}

function fileSafe(s){
  return String(s||'thi-sinh').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D')
    .replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'thi_sinh';
}
async function downloadPDF(){
  const el = $('#result-sheet');
  if(typeof window.html2pdf !== 'function'){ window.print(); return; }
  const btn = $('#btn-pdf');
  btn.disabled = true; btn.textContent = 'Đang tạo PDF…';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    el.classList.add('exporting');
    await window.html2pdf().set({
      margin:[10,10,12,10],
      filename:`KetQua_HSK3_${fileSafe(state.name)}.pdf`,
      image:{type:'jpeg', quality:0.95},
      html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak:{mode:['css','legacy'], avoid:['tr','.rs-cards','.rs-sign','.rs-head']}
    }).from(el).save();
  }catch(e){
    await modal('Không tạo được PDF', '<p>Trình duyệt chưa tạo được file PDF. Hãy bấm nút <b>In</b> rồi chọn “Lưu dưới dạng PDF”.</p>', 'Đã hiểu', null);
  }finally{
    el.classList.remove('exporting');
    btn.disabled = false; btn.textContent = 'Tải PDF';
  }
}

async function newExam(){
  const ok = await modal('Làm bài mới?', '<p>Toàn bộ bài làm và kết quả hiện tại trên máy này sẽ bị xóa. Hãy tải PDF kết quả trước nếu cần lưu lại.</p>', 'Xóa và làm lại', 'Hủy');
  if(!ok) return;
  try{ localStorage.removeItem(STORE); }catch(e){}
  location.hash = 'listening';
  location.reload();
}

/* =====================================================================
   SỰ KIỆN
   ===================================================================== */
document.addEventListener('click', e=>{
  const opt = e.target.closest('.opt');
  if(opt && !opt.disabled){
    const n = +opt.dataset.q, v = opt.dataset.v;
    setAnswer(n, ans(n)===v ? '' : v);
    return;
  }
  const tab = e.target.closest('.tab');
  if(tab){ showTab(tab.dataset.tab); return; }
  const go = e.target.closest('[data-go]');
  if(go){ showTab(go.dataset.go); return; }
  const nv = e.target.closest('.nv');
  if(nv){ const el = document.getElementById('q-'+nv.dataset.n); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(e.target.closest('[data-action="submit"]')){ submit(); return; }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.matches('input.hz, textarea.wt')) setAnswer(+t.dataset.q, t.value);
});
$('#cand-name').addEventListener('input', e=>{ if(state.submitted) return; state.name = e.target.value; save(); });
$('#btn-submit').addEventListener('click', submit);
$('#btn-review').addEventListener('click', ()=>showTab('listening'));
$('#btn-print').addEventListener('click', ()=>window.print());
$('#btn-pdf').addEventListener('click', downloadPDF);
$('#btn-new').addEventListener('click', newExam);

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
load();
renderListening(); renderReading(); renderWriting(); renderNavi();
$('#cand-name').value = state.name || '';
$$('input.hz, textarea.wt').forEach(el=>{ el.value = state.answers[el.dataset.q] || ''; });
range(1,70).forEach(refreshQ);
updateCounts();
if(state.submitted) applyLock();
const startHash = (location.hash||'').slice(1);
if(state.submitted && (startHash==='ketqua' || !SECS[startHash])) showResult();
else showTab(SECS[startHash] ? startHash : 'listening');
})();
</script>
